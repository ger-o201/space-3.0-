<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Space Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05050f;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;position:absolute;top:0;left:0;touch-action:none}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#1a1a3e 0%,#05050f 100%);
  z-index:10;padding:20px;overflow-y:auto}
.screen.active{display:flex}

.logo{font-size:clamp(36px,9vw,54px);font-weight:900;letter-spacing:3px;text-align:center;margin-bottom:8px;
  background:linear-gradient(135deg,#00d4ff,#a855f7,#ff0080);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(168,85,247,0.6))}
.sub{font-size:12px;color:#8899cc;letter-spacing:4px;margin-bottom:30px;text-transform:uppercase}

.btn{background:linear-gradient(135deg,#1e2a5e,#2c3e7e);color:#fff;border:2px solid #4a6ee0;
  padding:14px 28px;font-size:16px;font-weight:bold;border-radius:14px;cursor:pointer;
  margin:6px 0;min-width:270px;font-family:inherit;letter-spacing:1px;
  transition:transform 0.1s,box-shadow 0.15s;box-shadow:0 4px 16px rgba(74,110,224,0.25)}
.btn:hover,.btn:active{background:linear-gradient(135deg,#2c3e7e,#4a6ee0);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(74,110,224,0.55)}
.btn.purple{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#c084fc;
  box-shadow:0 4px 20px rgba(168,85,247,0.4)}
.btn.purple:hover{box-shadow:0 8px 30px rgba(168,85,247,0.7)}
.btn.green{background:linear-gradient(135deg,#15803d,#22c55e);border-color:#4ade80;
  box-shadow:0 4px 20px rgba(34,197,94,0.4)}
.btn.green:hover{box-shadow:0 8px 30px rgba(34,197,94,0.7)}
.btn.red{background:linear-gradient(135deg,#991b1b,#dc2626);border-color:#ef4444;
  box-shadow:0 4px 20px rgba(220,38,38,0.4)}
.btn.red:hover{box-shadow:0 8px 30px rgba(220,38,38,0.7)}

#hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:none;justify-content:space-between;
  align-items:center;z-index:5;font-weight:bold;font-size:14px;pointer-events:none;
  text-shadow:0 2px 6px #000;gap:8px}
#hud.on{display:flex}
.hud-box{background:rgba(0,0,0,0.55);padding:6px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);white-space:nowrap}

/* BOTÓN DE BOMBA */
#btnBomba{
  position:fixed;bottom:30px;right:30px;
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,#ff4444,#991111);
  border:4px solid #ff8888;
  color:#fff;font-size:52px;
  cursor:pointer;z-index:6;
  display:none;
  box-shadow:0 0 30px rgba(255,68,68,0.9),inset 0 0 20px rgba(255,255,255,0.3);
  animation:pulsoBomba 1.5s infinite;
  font-family:inherit;
  line-height:1;
  padding:0;
  align-items:center;justify-content:center;
}
#btnBomba.on{display:flex}
#btnBomba:active{transform:scale(0.9)}
#btnBomba.usada{
  background:radial-gradient(circle,#555,#222);
  border-color:#777;
  box-shadow:none;
  animation:none;
  cursor:not-allowed;
}
@keyframes pulsoBomba{
  0%,100%{box-shadow:0 0 30px rgba(255,68,68,0.9),inset 0 0 20px rgba(255,255,255,0.3)}
  50%{box-shadow:0 0 50px rgba(255,68,68,1),inset 0 0 30px rgba(255,255,255,0.6)}
}

.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-120px);
  background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:bold;
  padding:12px 26px;border-radius:30px;z-index:100;font-size:14px;
  box-shadow:0 10px 30px rgba(34,197,94,0.5);transition:transform 0.35s ease;
  pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:linear-gradient(135deg,#dc2626,#991b1b);box-shadow:0 10px 30px rgba(220,38,38,0.5)}

#joy{position:fixed;bottom:30px;left:30px;width:140px;height:140px;border-radius:50%;
  background:rgba(100,140,255,0.12);border:2px solid rgba(100,140,255,0.4);
  display:none;z-index:5;touch-action:none}
#joy.on{display:block}
#joyK{position:absolute;top:50%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
  background:radial-gradient(circle,#4a6ee0,#1e2a5e);border-radius:50%;
  box-shadow:0 0 20px rgba(74,110,224,0.9);pointer-events:none}

.stats-row{display:flex;gap:25px;margin:22px 0;flex-wrap:wrap;justify-content:center}
.stat-box{text-align:center;min-width:70px}
.stat-val{font-size:30px;font-weight:900;color:#00d4ff;line-height:1}
.stat-lbl{font-size:10px;color:#8899cc;letter-spacing:2px;margin-top:6px}

.shop-list{max-width:480px;width:100%;max-height:56vh;overflow-y:auto;padding:6px}
.shop-item{display:flex;align-items:center;background:rgba(20,25,55,0.9);
  border:2px solid #2c3e7e;border-radius:14px;padding:12px 14px;margin-bottom:10px;
  transition:border-color 0.2s}
.shop-item.maxed{border-color:#22c55e}
.shop-item.especial{border-color:#ff4444;background:linear-gradient(135deg,rgba(60,10,10,0.95),rgba(20,25,55,0.9));
  box-shadow:0 0 20px rgba(255,68,68,0.4)}
.shop-item.especial.maxed{border-color:#00ff88;background:linear-gradient(135deg,rgba(10,60,20,0.95),rgba(20,25,55,0.9))}
.shop-ico{font-size:30px;margin-right:14px;min-width:40px;text-align:center}
.shop-info{flex:1;text-align:left}
.shop-name{font-size:15px;font-weight:bold}
.shop-item.especial .shop-name{color:#ff8888;text-shadow:0 0 8px rgba(255,68,68,0.8)}
.shop-desc{font-size:11px;color:#8899cc;margin-top:2px}
.shop-item.especial .shop-desc{color:#ffb3b3}
.shop-lvl{font-size:10px;color:#ffd700;margin-top:3px;font-weight:bold}
.shop-price{padding:9px 13px;border-radius:10px;font-weight:bold;font-size:13px;
  white-space:nowrap;color:#ffd700;background:rgba(255,215,0,0.15);
  border:1px solid rgba(255,215,0,0.4);cursor:pointer;transition:transform 0.1s}
.shop-price:active{transform:scale(0.94)}
.shop-price.disabled{opacity:0.35;cursor:default}
.shop-price.maxed{background:#22c55e;color:#000;border-color:#22c55e;cursor:default}
.shop-item.especial .shop-price{color:#ff8888;background:rgba(255,68,68,0.2);border-color:rgba(255,68,68,0.6)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal-box{background:linear-gradient(135deg,#1a1a3e,#0f0f25);
  border:2px solid #a855f7;border-radius:20px;padding:28px;
  max-width:420px;width:100%;text-align:center;
  box-shadow:0 0 60px rgba(168,85,247,0.5)}
.modal-box h2{color:#a855f7;margin-bottom:12px;font-size:22px}
.modal-box p{color:#8899cc;font-size:13px;margin-bottom:18px;line-height:1.4}
.modal-box input{width:100%;padding:14px;font-size:16px;text-align:center;
  background:rgba(0,0,0,0.6);border:2px solid #4a6ee0;border-radius:12px;
  color:#fff;outline:none;font-family:monospace;letter-spacing:3px;
  margin-bottom:14px;text-transform:uppercase}
.modal-box input:focus{border-color:#a855f7}

.monedas-display{color:#ffd700;font-size:24px;font-weight:900;margin:12px 0;
  text-shadow:0 0 20px rgba(255,215,0,0.5)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-box">🎯 <span id="hNiv">1</span></div>
  <div class="hud-box">❤️ <span id="hVida">100</span></div>
  <div class="hud-box">💰 <span id="hMon">0</span></div>
</div>

<div id="joy"><div id="joyK"></div></div>

<!-- BOTÓN DE BOMBA -->
<button id="btnBomba" onclick="usarBomba()">💣</button>

<!-- MENÚ -->
<div class="screen active" id="sMenu">
  <div class="logo">SPACE RUNNER</div>
  <div class="sub">★ SOBREVIVE AL INFINITO ★</div>
  <button class="btn purple" onclick="empezar('camp',1)">🚀 CAMPAÑA</button>
  <button class="btn" onclick="empezar('inf',1)">💀 SUPERVIVENCIA</button>
  <button class="btn green" onclick="abrirTienda()">🛒 TIENDA</button>
  <button class="btn" onclick="abrirCodigo()">🔓 CÓDIGOS</button>
  <button class="btn red" onclick="borrarProgreso()">🗑️ BORRAR PROGRESO</button>
</div>

<!-- TIENDA -->
<div class="screen" id="sTienda">
  <div class="logo" style="font-size:34px">🛒 TIENDA</div>
  <div class="monedas-display">💰 <span id="tMonedas">0</span></div>
  <div class="shop-list" id="tLista"></div>
  <button class="btn" onclick="volverMenu()" style="margin-top:14px">◀ VOLVER AL MENÚ</button>
</div>

<!-- FIN DE NIVEL -->
<div class="screen" id="sFin">
  <div class="logo" style="font-size:36px" id="fTitulo">¡NIVEL COMPLETADO!</div>
  <div class="sub" id="fSub">Sigue avanzando, piloto</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val" id="fMon">0</div><div class="stat-lbl">MONEDAS</div></div>
    <div class="stat-box"><div class="stat-val" id="fEn">0</div><div class="stat-lbl">ENEMIGOS</div></div>
  </div>
  <button class="btn green" onclick="siguienteNivel()">➡ SIGUIENTE NIVEL</button>
  <button class="btn" onclick="volverMenu()">🏠 MENÚ</button>
</div>

<!-- GAME OVER -->
<div class="screen" id="sOver">
  <div class="logo" style="font-size:44px;background:linear-gradient(135deg,#dc2626,#991b1b);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">GAME OVER</div>
  <div class="sub">TU COHETE FUE DESTRUIDO</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val" id="oMon">0</div><div class="stat-lbl">MONEDAS</div></div>
    <div class="stat-box"><div class="stat-val" id="oEn">0</div><div class="stat-lbl">ENEMIGOS</div></div>
    <div class="stat-box"><div class="stat-val" id="oNiv">1</div><div class="stat-lbl">NIVEL</div></div>
  </div>
  <button class="btn purple" onclick="reintentar()">🔄 REINTENTAR</button>
  <button class="btn" onclick="volverMenu()">🏠 MENÚ</button>
</div>

<!-- MODAL CÓDIGO -->
<div class="modal" id="mCodigo">
  <div class="modal-box">
    <h2>🔓 INTRODUCIR CÓDIGO</h2>
    <p>Escribe un código para recibir recompensas</p>
    <input type="text" id="inCodigo" placeholder="CÓDIGO" maxlength="24" autocomplete="off">
    <button class="btn purple" onclick="validarCodigo()" style="width:100%;min-width:0">DESBLOQUEAR</button>
    <button class="btn" onclick="cerrarCodigo()" style="width:100%;min-width:0;margin-top:8px">CANCELAR</button>
  </div>
</div>

<div class="toast" id="toast">Notificación</div>

<script>
// ==================================================
// ESTADO GLOBAL
// ==================================================
var cv, cx, W, H;
var P, enemigos, balas, balasE, monedasItems, particulas, estrellas;
var nivel, modoJuego, monedasNivel, kills;
var spawnRestantes, spawnTimer;
var activo = false, pausado = false;
var mouse = { x: 0, y: 0, disparando: false };
var teclas = {};
var esTactil = false;
var joyActivo = false, joyVec = { x: 0, y: 0 }, joyId = null, disparoId = null;

// Estado de la bomba en la partida actual
var bombaDisponible = false;   // Si se puede usar (compró la mejora o código maestro)
var bombaUsadaEstaPartida = false; // Solo se puede usar 1 vez por partida (salvo maestro)
var bombaInfinitas = false;    // Código maestro activado → uso ilimitado

var save = {
  monedas: 0,
  nivelMax: 1,
  mejoras: { vida: 0, daño: 0, vel: 0, cad: 0, iman: 0, esc: 0, bomba: 0 }
};

// ==================================================
// CARGAR / GUARDAR
// ==================================================
function cargar() {
  try {
    var raw = localStorage.getItem('sr_save_v3');
    if (!raw) return;
    var d = JSON.parse(raw);
    if (typeof d.monedas === 'number') save.monedas = d.monedas;
    if (typeof d.nivelMax === 'number') save.nivelMax = d.nivelMax;
    if (d.mejoras) {
      for (var k in save.mejoras) {
        if (typeof d.mejoras[k] === 'number') save.mejoras[k] = d.mejoras[k];
      }
    }
  } catch(e) {}
}
function guardar() {
  try { localStorage.setItem('sr_save_v3', JSON.stringify(save)); } catch(e) {}
}

// ==================================================
// INICIO
// ==================================================
window.onload = function() {
  cv = document.getElementById('cv');
  cx = cv.getContext('2d');
  esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  cargar();
  resize();
  window.addEventListener('resize', resize);
  setupControles();
  volverMenu();
  requestAnimationFrame(loop);
};

function resize() {
  if (!cv) return;
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}

// ==================================================
// PANTALLAS
// ==================================================
function mostrarPantalla(id) {
  var pantallas = ['sMenu', 'sTienda', 'sFin', 'sOver'];
  for (var i = 0; i < pantallas.length; i++) {
    var el = document.getElementById(pantallas[i]);
    if (el) el.classList.remove('active');
  }
  if (id) {
    var el2 = document.getElementById(id);
    if (el2) el2.classList.add('active');
  }
  var hud = document.getElementById('hud');
  var joy = document.getElementById('joy');
  var btnB = document.getElementById('btnBomba');
  if (hud) hud.classList.toggle('on', id === null);
  if (joy) joy.classList.toggle('on', id === null && esTactil);
  if (btnB && id !== null) btnB.classList.remove('on');
}

function volverMenu() {
  activo = false;
  pausado = false;
  mouse.disparando = false;
  joyVec = { x: 0, y: 0 };
  bombaDisponible = false;
  bombaUsadaEstaPartida = false;
  actualizarBotonBomba();
  mostrarPantalla('sMenu');
}

// ==================================================
// EMPEZAR JUEGO
// ==================================================
function empezar(modo, niv) {
  modoJuego = modo;
  nivel = niv || 1;

  enemigos = []; balas = []; balasE = []; monedasItems = []; particulas = [];
  estrellas = [];
  for (var i = 0; i < 120; i++) {
    estrellas.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * 2 + 0.5
    });
  }

  P = {
    x: W / 2, y: H / 2, r: 16,
    vel: 4 + save.mejoras.vel * 0.5,
    vidaMax: 100 + save.mejoras.vida * 20,
    vida: 100 + save.mejoras.vida * 20,
    daño: 1 + save.mejoras.daño,
    cdMax: Math.max(3, 8 - save.mejoras.cad),
    cd: 0,
    ang: -Math.PI / 2,
    inv: 0,
    esc: save.mejoras.esc,
    iman: 30 + save.mejoras.iman * 30
  };

  // Resetear estado de bomba al empezar partida
  bombaUsadaEstaPartida = false;
  bombaDisponible = (save.mejoras.bomba > 0) || bombaInfinitas;

  monedasNivel = 0;
  kills = 0;
  spawnTimer = 0;
  spawnRestantes = (modo === 'camp') ? (5 + nivel * 3) : 999999;
  activo = true;
  pausado = false;
  mouse.disparando = false;
  joyVec = { x: 0, y: 0 };

  mostrarPantalla(null);
  actualizarHUD();
  actualizarBotonBomba();
}

function actualizarHUD() {
  if (!P) return;
  document.getElementById('hNiv').textContent = (modoJuego === 'inf') ? '∞' : nivel;
  document.getElementById('hMon').textContent = save.monedas;
  document.getElementById('hVida').textContent = Math.max(0, Math.ceil(P.vida));
}

// ==================================================
// BOTÓN DE BOMBA
// ==================================================
function actualizarBotonBomba() {
  var btn = document.getElementById('btnBomba');
  if (!btn) return;
  var visible = activo && bombaDisponible && (bombaInfinitas || !bombaUsadaEstaPartida);
  btn.classList.toggle('on', visible);
  btn.classList.toggle('usada', visible && bombaUsadaEstaPartida && !bombaInfinitas);
}

function usarBomba() {
  if (!activo || pausado) return;
  if (!bombaDisponible) return;
  if (bombaUsadaEstaPartida && !bombaInfinitas) {
    toast('💣 Ya usaste tu bomba en esta partida', true);
    return;
  }

  // Marcar como usada (salvo si tiene bombas infinitas)
  if (!bombaInfinitas) bombaUsadaEstaPartida = true;

  // 💥 EXPLOSIÓN: elimina todos los enemigos en pantalla
  var cantidad = enemigos.length;
  for (var i = enemigos.length - 1; i >= 0; i--) {
    var e = enemigos[i];
    // Partículas de explosión
    for (var k = 0; k < 15; k++) {
      particulas.push({
        x: e.x, y: e.y,
        vx: (Math.random() - 0.5) * 15,
        vy: (Math.random() - 0.5) * 15,
        vida: 30, mv: 30, color: '#ff4444', r: 5
      });
    }
    // Monedas
    for (var mm = 0; mm < e.mon; mm++) {
      monedasItems.push({
        x: e.x + (Math.random() - 0.5) * 20,
        y: e.y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        r: 7, ang: 0
      });
    }
    enemigos.splice(i, 1);
    kills++;
  }

  // Destruir también todas las balas enemigas
  balasE = [];

  // Onda expansiva visual desde el cohete
  for (var k2 = 0; k2 < 60; k2++) {
    var ang = (Math.PI * 2 / 60) * k2;
    particulas.push({
      x: P.x, y: P.y,
      vx: Math.cos(ang) * 12,
      vy: Math.sin(ang) * 12,
      vida: 40, mv: 40, color: '#ff8800', r: 6
    });
  }

  // Sonido de explosión
  son(120, 0.4, 'sawtooth', 0.15);
  setTimeout(function(){ son(80, 0.5, 'sawtooth', 0.12); }, 100);
  setTimeout(function(){ son(60, 0.6, 'sawtooth', 0.1); }, 200);

  toast('💥 ¡BOMBA ACTIVADA! Eliminaste ' + cantidad + ' enemigos');
  actualizarBotonBomba();
}

// ==================================================
// SPAWN
// ==================================================
function spawnEnemigo() {
  var lado = Math.floor(Math.random() * 4);
  var x, y;
  if (lado === 0) { x = Math.random() * W; y = -30; }
  else if (lado === 1) { x = W + 30; y = Math.random() * H; }
  else if (lado === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  var nv = (modoJuego === 'inf') ? Math.min(15, 1 + Math.floor(kills / 8)) : nivel;
  var tipos = nv < 2 ? ['basico'] : ['basico', 'basico', 'rapido', 'tanque', 'franco'];
  var t = tipos[Math.floor(Math.random() * tipos.length)];

  var e = { x: x, y: y, tipo: t, ang: 0, cd: 60 + Math.random() * 60 };
  var escala = 1 + (nv - 1) * 0.15;

  if (t === 'basico') {
    e.r = 15; e.vel = 1.6 * escala; e.vida = 2 + Math.floor(nv / 3);
    e.color = '#ff4757'; e.daño = 10; e.mon = 1;
  } else if (t === 'rapido') {
    e.r = 11; e.vel = 3.2 * escala; e.vida = 1 + Math.floor(nv / 4);
    e.color = '#ffa502'; e.daño = 8; e.mon = 1;
  } else if (t === 'tanque') {
    e.r = 24; e.vel = 1.0 * escala; e.vida = 6 + nv;
    e.color = '#a55eea'; e.daño = 18; e.mon = 3;
  } else {
    e.r = 14; e.vel = 1.2 * escala; e.vida = 3 + Math.floor(nv / 2);
    e.color = '#26de81'; e.daño = 25; e.mon = 2; e.rango = 400;
  }
  e.vidaMax = e.vida;
  enemigos.push(e);
}

// ==================================================
// DISPARO Y DAÑO
// ==================================================
function disparar() {
  P.cd = P.cdMax;
  balas.push({
    x: P.x + Math.cos(P.ang) * P.r,
    y: P.y + Math.sin(P.ang) * P.r,
    vx: Math.cos(P.ang) * 12,
    vy: Math.sin(P.ang) * 12,
    r: 3, vida: 60
  });
  son(700, 0.03);
}

function dañarJugador(cantidad) {
  if (P.inv > 0) return;
  if (P.esc > 0) {
    P.esc--; P.inv = 40;
    for (var k = 0; k < 15; k++) {
      particulas.push({
        x: P.x, y: P.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        vida: 25, mv: 25, color: '#00d4ff', r: 3
      });
    }
    return;
  }
  P.vida -= cantidad; P.inv = 10;
  actualizarHUD();
  if (P.vida <= 0) {
    P.vida = 0;
    activo = false;
    document.getElementById('oMon').textContent = monedasNivel;
    document.getElementById('oEn').textContent = kills;
    document.getElementById('oNiv').textContent = (modoJuego === 'inf') ? '∞' : nivel;
    mostrarPantalla('sOver');
    son(150, 0.4, 'sawtooth', 0.15);
  }
}

// ==================================================
// LOOP
// ==================================================
function loop() {
  requestAnimationFrame(loop);
  update();
  draw();
}

function update() {
  if (!activo || pausado) return;

  for (var i = 0; i < estrellas.length; i++) {
    estrellas[i].y += estrellas[i].z * 0.5;
    if (estrellas[i].y > H) {
      estrellas[i].y = 0;
      estrellas[i].x = Math.random() * W;
    }
  }

  var dx = 0, dy = 0;
  if (teclas['a'] || teclas['arrowleft']) dx--;
  if (teclas['d'] || teclas['arrowright']) dx++;
  if (teclas['w'] || teclas['arrowup']) dy--;
  if (teclas['s'] || teclas['arrowdown']) dy++;
  dx += joyVec.x; dy += joyVec.y;
  var m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  P.x += dx * P.vel;
  P.y += dy * P.vel;
  P.x = Math.max(P.r, Math.min(W - P.r, P.x));
  P.y = Math.max(P.r, Math.min(H - P.r, P.y));

  P.ang = Math.atan2(mouse.y - P.y, mouse.x - P.x);

  if (P.cd > 0) P.cd--;
  if (P.inv > 0) P.inv--;

  if (mouse.disparando && P.cd <= 0) disparar();

  if (spawnRestantes > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemigo();
      spawnRestantes--;
      spawnTimer = (modoJuego === 'inf')
        ? Math.max(15, 45 - kills * 0.2)
        : Math.max(20, 50 - nivel * 2);
    }
  }

  for (var i = enemigos.length - 1; i >= 0; i--) {
    var e = enemigos[i];
    var a = Math.atan2(P.y - e.y, P.x - e.x);
    e.ang = a;

    if (e.tipo === 'franco') {
      var d = Math.hypot(P.x - e.x, P.y - e.y);
      if (d > 250) { e.x += Math.cos(a) * e.vel; e.y += Math.sin(a) * e.vel; }
      else if (d < 200) { e.x -= Math.cos(a) * e.vel; e.y -= Math.sin(a) * e.vel; }
    } else {
      e.x += Math.cos(a) * e.vel;
      e.y += Math.sin(a) * e.vel;
    }

    e.cd--;
    if (e.cd <= 0) {
      var d2 = Math.hypot(P.x - e.x, P.y - e.y);
      var rango = e.rango || 500;
      if (d2 < rango) {
        e.cd = (e.tipo === 'franco') ? 150 : 80 + Math.random() * 70;
        balasE.push({
          x: e.x + Math.cos(a) * e.r,
          y: e.y + Math.sin(a) * e.r,
          vx: Math.cos(a) * (e.tipo === 'franco' ? 9 : 5),
          vy: Math.sin(a) * (e.tipo === 'franco' ? 9 : 5),
          r: 4, vida: 150, daño: e.daño
        });
      }
    }

    if (Math.hypot(P.x - e.x, P.y - e.y) < P.r + e.r) {
      dañarJugador(0.6);
    }
  }

  for (var i = balas.length - 1; i >= 0; i--) {
    var b = balas[i];
    b.x += b.vx; b.y += b.vy; b.vida--;
    if (b.vida <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
      balas.splice(i, 1); continue;
    }
    var impacto = false;
    for (var j = enemigos.length - 1; j >= 0; j--) {
      var e2 = enemigos[j];
      if (Math.hypot(b.x - e2.x, b.y - e2.y) < e2.r + b.r) {
        e2.vida -= P.daño;
        impacto = true;
        if (e2.vida <= 0) {
          for (var k = 0; k < 12; k++) {
            particulas.push({
              x: e2.x, y: e2.y,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 10,
              vida: 25, mv: 25, color: e2.color, r: 3
            });
          }
          for (var mm = 0; mm < e2.mon; mm++) {
            monedasItems.push({
              x: e2.x + (Math.random() - 0.5) * 20,
              y: e2.y + (Math.random() - 0.5) * 20,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2,
              r: 7, ang: 0
            });
          }
          enemigos.splice(j, 1);
          kills++;
          son(440, 0.08);
        }
        break;
      }
    }
    if (impacto) balas.splice(i, 1);
  }

  for (var i = balasE.length - 1; i >= 0; i--) {
    var b = balasE[i];
    b.x += b.vx; b.y += b.vy; b.vida--;
    if (b.vida <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
      balasE.splice(i, 1); continue;
    }
    if (Math.hypot(b.x - P.x, b.y - P.y) < P.r + b.r) {
      dañarJugador(b.daño);
      balasE.splice(i, 1);
    }
  }

  for (var i = monedasItems.length - 1; i >= 0; i--) {
    var mn = monedasItems[i];
    mn.ang += 0.15;
    mn.x += mn.vx; mn.y += mn.vy;
    mn.vx *= 0.95; mn.vy *= 0.95;
    var dd = Math.hypot(P.x - mn.x, P.y - mn.y);
    if (dd < P.iman + 40) {
      var aa = Math.atan2(P.y - mn.y, P.x - mn.x);
      mn.x += Math.cos(aa) * 4;
      mn.y += Math.sin(aa) * 4;
    }
    if (dd < P.r + mn.r) {
      monedasItems.splice(i, 1);
      save.monedas++;
      monedasNivel++;
      guardar();
      actualizarHUD();
      son(880, 0.05);
    }
  }

  for (var i = particulas.length - 1; i >= 0; i--) {
    var p2 = particulas[i];
    p2.x += p2.vx; p2.y += p2.vy;
    p2.vx *= 0.94; p2.vy *= 0.94;
    p2.vida--;
    if (p2.vida <= 0) particulas.splice(i, 1);
  }

  if (modoJuego === 'camp' && spawnRestantes === 0 && enemigos.length === 0) {
    activo = false;
    if (nivel >= save.nivelMax) save.nivelMax = nivel + 1;
    guardar();
    document.getElementById('fTitulo').textContent = '¡NIVEL ' + nivel + ' COMPLETADO!';
    document.getElementById('fSub').textContent = 'Sigue avanzando, piloto';
    document.getElementById('fMon').textContent = monedasNivel;
    document.getElementById('fEn').textContent = kills;
    mostrarPantalla('sFin');
    son(523, 0.15); setTimeout(function(){ son(659, 0.15); }, 150);
    setTimeout(function(){ son(784, 0.3); }, 300);
  }
}

// ==================================================
// DIBUJAR
// ==================================================
function draw() {
  cx.fillStyle = '#05050f';
  cx.fillRect(0, 0, W, H);

  if (!P) return;

  for (var i = 0; i < estrellas.length; i++) {
    var s = estrellas[i];
    cx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.z * 0.2) + ')';
    cx.fillRect(s.x, s.y, s.z, s.z);
  }

  for (var i = 0; i < particulas.length; i++) {
    var p2 = particulas[i];
    cx.globalAlpha = p2.vida / p2.mv;
    cx.fillStyle = p2.color;
    cx.beginPath();
    cx.arc(p2.x, p2.y, p2.r * (p2.vida / p2.mv), 0, Math.PI * 2);
    cx.fill();
  }
  cx.globalAlpha = 1;

  for (var i = 0; i < monedasItems.length; i++) {
    var mn = monedasItems[i];
    cx.save();
    cx.translate(mn.x, mn.y);
    cx.rotate(mn.ang);
    cx.fillStyle = '#ffd700';
    cx.shadowColor = '#ffd700';
    cx.shadowBlur = 12;
    cx.beginPath();
    cx.arc(0, 0, mn.r, 0, Math.PI * 2);
    cx.fill();
    cx.shadowBlur = 0;
    cx.fillStyle = '#b8860b';
    cx.font = 'bold 9px Arial';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('$', 0, 0.5);
    cx.restore();
  }

  cx.fillStyle = '#00d4ff';
  cx.shadowColor = '#00d4ff';
  cx.shadowBlur = 10;
  for (var i = 0; i < balas.length; i++) {
    cx.beginPath();
    cx.arc(balas[i].x, balas[i].y, balas[i].r, 0, Math.PI * 2);
    cx.fill();
  }
  cx.shadowBlur = 0;

  cx.fillStyle = '#ff4757';
  cx.shadowColor = '#ff4757';
  cx.shadowBlur = 10;
  for (var i = 0; i < balasE.length; i++) {
    cx.beginPath();
    cx.arc(balasE[i].x, balasE[i].y, balasE[i].r, 0, Math.PI * 2);
    cx.fill();
  }
  cx.shadowBlur = 0;

  for (var i = 0; i < enemigos.length; i++) {
    var e = enemigos[i];
    cx.save();
    cx.translate(e.x, e.y);
    cx.rotate(e.ang);
    cx.shadowColor = e.color;
    cx.shadowBlur = 12;
    cx.fillStyle = e.color;
    cx.beginPath();
    cx.arc(0, 0, e.r, 0, Math.PI * 2);
    cx.fill();
    cx.shadowBlur = 0;
    cx.fillStyle = '#fff';
    cx.beginPath();
    cx.arc(e.r * 0.3, 0, e.r * 0.25, 0, Math.PI * 2);
    cx.fill();
    cx.restore();

    if (e.vidaMax > 2 && e.vida < e.vidaMax) {
      cx.fillStyle = 'rgba(0,0,0,0.6)';
      cx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 4);
      cx.fillStyle = e.color;
      cx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * (e.vida / e.vidaMax), 4);
    }
  }

  // ============ COHETE ============
  cx.save();
  cx.translate(P.x, P.y);
  cx.rotate(P.ang);
  if (P.inv > 0 && Math.floor(P.inv / 2) % 2 === 0) cx.globalAlpha = 0.4;

  var flicker = Math.random() * 4;
  cx.fillStyle = 'rgba(255,180,0,0.85)';
  cx.shadowColor = '#ff8800';
  cx.shadowBlur = 20;
  cx.beginPath();
  cx.moveTo(-P.r - 4, -5);
  cx.lineTo(-P.r - 18 - flicker, 0);
  cx.lineTo(-P.r - 4, 5);
  cx.closePath();
  cx.fill();
  cx.fillStyle = 'rgba(255,255,150,0.95)';
  cx.shadowColor = '#ffcc00';
  cx.beginPath();
  cx.moveTo(-P.r - 4, -2);
  cx.lineTo(-P.r - 12 - flicker * 0.5, 0);
  cx.lineTo(-P.r - 4, 2);
  cx.closePath();
  cx.fill();
  cx.shadowBlur = 0;

  cx.fillStyle = '#e8e8e8';
  cx.shadowColor = '#00d4ff';
  cx.shadowBlur = 15;
  cx.beginPath();
  cx.moveTo(P.r + 6, 0);
  cx.lineTo(P.r - 2, -P.r * 0.45);
  cx.lineTo(-P.r, -P.r * 0.55);
  cx.lineTo(-P.r, P.r * 0.55);
  cx.lineTo(P.r - 2, P.r * 0.45);
  cx.closePath();
  cx.fill();

  cx.fillStyle = '#dc2626';
  cx.fillRect(-P.r * 0.5, -P.r * 0.5, P.r * 0.7, P.r);

  cx.fillStyle = '#00d4ff';
  cx.shadowColor = '#00d4ff';
  cx.shadowBlur = 12;
  cx.beginPath();
  cx.arc(P.r * 0.15, 0, P.r * 0.35, 0, Math.PI * 2);
  cx.fill();
  cx.shadowBlur = 0;

  cx.fillStyle = 'rgba(255,255,255,0.7)';
  cx.beginPath();
  cx.arc(P.r * 0.05, -P.r * 0.12, P.r * 0.13, 0, Math.PI * 2);
  cx.fill();

  if (P.esc > 0) {
    cx.strokeStyle = 'rgba(0,212,255,0.75)';
    cx.lineWidth = 2;
    cx.shadowColor = '#00d4ff';
    cx.shadowBlur = 15;
    for (var i = 0; i < P.esc; i++) {
      cx.beginPath();
      cx.arc(0, 0, P.r + 8 + i * 5, 0, Math.PI * 2);
      cx.stroke();
    }
    cx.shadowBlur = 0;
  }

  cx.restore();
  cx.globalAlpha = 1;
}

  { id: 'iman',   ico: '🧲', nom: 'Imán de monedas', desc: 'Atrae monedas de más lejos', max: 100, base: 50,  inc: 50 },

];

function abrirTienda() {
  mostrarPantalla('sTienda');
  renderTienda();
}

function renderTienda() {
  document.getElementById('tMonedas').textContent = save.monedas;
  var cont = document.getElementById('tLista');
  cont.innerHTML = '';

  for (var i = 0; i < itemsTienda.length; i++) {
    var it = itemsTienda[i];
    var nvl = save.mejoras[it.id] || 0;
    var maxeado = nvl >= it.max;
    var precio = it.base + it.inc * nvl;
    var puede = !maxeado && save.monedas >= precio;

    var div = document.createElement('div');
    div.className = 'shop-item' + (maxeado ? ' maxed' : '') + (it.especial ? ' especial' : '');

    var precioClase = 'shop-price';
    if (maxeado) precioClase += ' maxed';
    else if (!puede) precioClase += ' disabled';

    div.innerHTML =
      '<div class="shop-ico">' + it.ico + '</div>' +
      '<div class="shop-info">' +
        '<div class="shop-name">' + it.nom + '</div>' +
        '<div class="shop-desc">' + it.desc + '</div>' +
        '<div class="shop-lvl">Nivel ' + nvl + ' / ' + it.max + '</div>' +
      '</div>' +
      '<div class="' + precioClase + '">' + (maxeado ? '✓ MAX' : '💰 ' + precio) + '</div>';

    if (!maxeado) {
      (function(item, price) {
        div.querySelector('.shop-price').onclick = function() {
          comprarItem(item, price);
        };
      })(it, precio);
    }
    cont.appendChild(div);
  }
}

function comprarItem(item, precio) {
  if (save.monedas < precio) {
    toast('❌ Monedas insuficientes', true);
    return;
  }
  save.monedas -= precio;
  save.mejoras[item.id]++;
  guardar();
  toast('✅ ' + item.nom + ' mejorado');
  son(880, 0.08);
  setTimeout(function() { son(1046, 0.1); }, 80);
  renderTienda();
}

function abrirCodigo() {
  document.getElementById('mCodigo').classList.add('on');

    var inp = document.getElementById('inCodigo');

function cerrarCodigo() {

}

function validarCodigo() {
  var inp = document.getElementById('inCodigo');
  var codigo = (inp.value || '').trim().toUpperCase();
  if (!codigo) { toast('❌ Escribe un código', true); return; }

  var manejado = false;

  // ============ CÓDIGOS PÚBLICOS ============
  if (codigo === 'SUPER') {
    save.monedas += 99999;
    for (var k in save.mejoras) save.mejoras[k] = 5;
    save.nivelMax = 50;
    toast('👑 ¡DESBLOQUEO TOTAL!');
    manejado = true;
  }
  else if (codigo === 'GODMODE') {
    for (var k2 in save.mejoras) save.mejoras[k2] = 5;
    save.monedas += 9999;
    toast('🔥 MODO DIOS ACTIVADO');
    manejado = true;
  }
  else if (codigo === 'RICO') {
    save.monedas += 10000;
    toast('💰 +10,000 MONEDAS');
    manejado = true;
  }
  else if (codigo === 'MAX') {
    for (var k3 in save.mejoras) save.mejoras[k3] = 5;
    toast('⚡ MEJORAS AL MÁXIMO');
    manejado = true;
  }
  else if (codigo === 'NIVEL50') {
    save.nivelMax = 50;
    toast('🚀 NIVEL 50 DESBLOQUEADO');
    manejado = true;
  }
  else if (codigo === 'MILLON' || codigo === '999999' || codigo === 'MONEDAS999999') {
    save.monedas += 999999;
    toast('🤑 ¡+999,999 MONEDAS!');
    manejado = true;
  }
  // ============ CÓDIGO ESPECIAL: BOMBA INFINITA ============
  else if (codigo === 'BOMBAINFINITA' || codigo === 'BOMBAS') {
    bombaInfinitas = true;
    save.mejoras.bomba = 1;
    toast('💣 ¡BOMBA INFINITA ACTIVADA!');
    manejado = true;
  }
  // ============ CÓDIGOS MAESTROS (SOLO TÚ) ============
  else if (codigo === 'JEFE2024' || codigo === 'MAESTRO' || codigo === 'ADMIN' || codigo === 'ISABELLA') {
    save.monedas += 99999999;
    for (var k4 in save.mejoras) save.mejoras[k4] = 5;
    save.nivelMax = 100;
    bombaInfinitas = true;
    bombaDisponible = true;
    toast('🔱 CÓDIGO MAESTRO ACTIVADO');
    setTimeout(function() {
      toast('👑 Todo al máximo + BOMBA INFINITA');
    }, 2000);
    manejado = true;
  }

  if (!manejado) {
    toast('❌ Código inválido', true);
    son(200, 0.2, 'sawtooth', 0.1);
    return;
  }

  guardar();
  son(523, 0.1); setTimeout(function() { son(659, 0.1); }, 100);
  setTimeout(function() { son(784, 0.1); }, 200);
  setTimeout(function() { son(1046, 0.3); }, 300);
  cerrarCodigo();
  actualizarBotonBomba();
}

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;

  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('on'); }, 2500);
}

// ==================================================
// AUDIO
// ==================================================
var ac = null;
function son(f, d, t, v) {
  try {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (!ac) return;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = t || 'square';
    o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + d);
  } catch(e) {}
}

function setupControles() {
  window.addEventListener('keydown', function(e) {
    teclas[e.key.toLowerCase()] = true;
    if (e.key === 'Escape' && activo) {
      pausado = !pausado;
      toast(pausado ? '⏸ PAUSADO' : '▶ REANUDADO');
    }
    // Tecla B para activar bomba (atajo rápido)
    if (e.key.toLowerCase() === 'b' && activo && !pausado) {
      usarBomba();
    }
    if (e.key === ' ' && activo) e.preventDefault();
  });
  window.addEventListener('keyup', function(e) {
    teclas[e.key.toLowerCase()] = false;
  });

  cv.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  cv.addEventListener('mousedown', function(e) {
    if (activo && !pausado) {
      mouse.disparando = true;
      mouse.x = e.clientX; mouse.y = e.clientY;
    }
  });
  cv.addEventListener('mouseup', function() { mouse.disparando = false; });
  cv.addEventListener('mouseleave', function() { mouse.disparando = false; });

  var joy = document.getElementById('joy');
  var joyK = document.getElementById('joyK');

  document.addEventListener('touchstart', function(e) {
    if (!activo || pausado) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      // Ignorar si toca el botón de bomba
      var btnB = document.getElementById('btnBomba');
      if (btnB && btnB.classList.contains('on')) {
        var rb = btnB.getBoundingClientRect();
        if (t.clientX > rb.left && t.clientX < rb.right && t.clientY > rb.top && t.clientY < rb.bottom) {
          continue;
        }
      }
      var r = joy.getBoundingClientRect();
      var enJoy = (t.clientX > r.left - 40 && t.clientX < r.right + 40 &&
                   t.clientY > r.top - 40 && t.clientY < r.bottom + 40);
      if (enJoy && joyId === null) {
        joyId = t.identifier;
        joyActivo = true;
        moverJoy(t);
      } else if (disparoId === null) {
        disparoId = t.identifier;
        mouse.x = t.clientX;
        mouse.y = t.clientY;
        mouse.disparando = true;
      }
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!activo) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) moverJoy(t);
      if (t.identifier === disparoId) {
        mouse.x = t.clientX;
        mouse.y = t.clientY;
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) {
        joyId = null;
        joyActivo = false;
        joyVec = { x: 0, y: 0 };
        if (joyK) joyK.style.transform = 'translate(0,0)';
      }
      if (t.identifier === disparoId) {
        disparoId = null;
        mouse.disparando = false;
      }
    }
  }, { passive: true });

  function moverJoy(t) {
    var r = joy.getBoundingClientRect();
    var cx2 = r.left + r.width / 2;
    var cy2 = r.top + r.height / 2;
    var dx = t.clientX - cx2;
    var dy = t.clientY - cy2;
    var d = Math.hypot(dx, dy);
    var max = 50;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    joyVec = { x: dx / max, y: dy / max };
    if (joyK) joyK.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
}
</script>
